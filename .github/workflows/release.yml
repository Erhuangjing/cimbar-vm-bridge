name: release

# 推送 v* 标签时自动打包并发布 Release，例如：
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（例如 v1.0.1，需已存在）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: 校验 vendor 文件
        run: cd vendor && sha256sum -c SHA256SUMS

      - name: 打包
        run: python3 tools/build.py "$TAG"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          FILES="cimbar-vm-bridge-$TAG.zip cimbar-send.html cimbar-recv.html"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "$TAG" --notes-file ../.github/release-notes.md
          fi
