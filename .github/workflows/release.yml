name: release

# 两种触发方式（任选其一）：
#   1. 修改仓库根目录的 RELEASE_VERSION（例如改成 v1.0.1）并推送到 main，工作流会自动建标签并发布
#   2. 推送 v* 标签：git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    branches:
      - main
    paths:
      - RELEASE_VERSION
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（例如 v1.0.1，需已存在）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 确定版本号
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(tr -d ' \r\n' < RELEASE_VERSION)
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: 校验 vendor 文件
        run: cd vendor && sha256sum -c SHA256SUMS

      - name: 打包
        run: python3 tools/build.py "$TAG"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          FILES="cimbar-vm-bridge-$TAG.zip cimbar-send.html cimbar-recv.html"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "$TAG" --target "$GITHUB_SHA" --notes-file ../.github/release-notes.md
          fi
